source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
    no_fade_in = true
    no_fade_out = true  
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

background {
    monitor =
    path = $HOME/Pictures/wallpaper.jpg   
    color = rgba(25, 20, 20, 1.0)

    blur_passes = 3 
    blur_size = 8
    noise = 0.0117
    contrast = 1.3000
    brightness = 0.7000   
    vibrancy = 0.2100
    vibrancy_darkness = 0.0
}

image {
    monitor =
    path = $HOME/Pictures/wallpaper.jpg 
    size = 120
    rounding = -1 
    border_size = 2
    border_color = rgba(255, 255, 255, 0.2)
    position = 0, 85
    halign = center
    valign = center
}

label {
    monitor =
    text = future
    color = rgba(255, 255, 255, 0.4)
    font_size = 14
    font_family = SF Pro Display, JetBrains Mono Nerd Font
    position = 0, 0
    halign = center
    valign = center
}


input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2 
    dots_size = 0.2
    dots_spacing = 0.35
    dots_center = true
    dots_fade_time = 20
    
    outer_color = rgba(255, 255, 255, 0.15)
    inner_color = rgba(255, 255, 255, 0.1) 
    font_color = rgba(255, 255, 255, 0.8)
    
    fade_on_empty = true
    placeholder_text = <span foreground="##ffffff66">eyes</span>
    hide_input = false
    
    check_color = rgba(255, 255, 255, 0.4)
    fail_color = rgba(255, 85, 85, 0.6) 
    fail_text = <i>rejected</i> 
    fail_transition = 300
    
    fail_timeout = 1000 
    
    rounding = -1 
    position = 0, -60 
    halign = center
    valign = center
}


label {
    monitor =
    text = still $TIME larping?
    color = rgba(255, 255, 255, 0.4)
    font_size = 10
    font_family = SF Pro Display, JetBrains Mono Nerd Font
    position = 0, 15
    halign = center
    valign = bottom
}

animations {
    enabled = true
    bezier = appleBezier, 0.1, 1, 0.2, 1

    animation = fadeIn, 1, 5, appleBezier
    animation = fadeOut, 1, 5, appleBezier
}
