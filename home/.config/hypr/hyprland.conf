#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 6
    gaps_out = 6
    border_size = 2

    col.active_border = rgba(00000000) rgba(FFFFFF25) 200deg 
    col.inactive_border = rgba(00000000) rgba(FFFFFF25) 200deg
    resize_on_border = false
    allow_tearing = false
    layout = idle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 18
    rounding_power = 4

    active_opacity = 0.85
    inactive_opacity = 0.4
    # inactive_opacity = 0.85

    shadow {
        enabled = true
        range = 10
        render_power = 5
        color = rgba(00000044)
        color_inactive = rgba(00000022)
        offset = 0, 10 
    }

    blur {
        enabled = true
        size = 10
        passes = 4
        new_optimizations = true
        xray = false
        
        noise = 0.02
        contrast = 1.0
        brightness = 1.1
        # vibrancy = 0.2
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations

# Faster one
# animations {
#     enabled = true

#     # --- Curves smooth ala Apple ---
#     bezier = appleFluid,       0.16, 1.00, 0.30, 1.00
#     bezier = appleIn,          0.20, 0.00, 0.00, 1.00
#     bezier = appleOut,         0.40, 0.00, 0.70, 0.60
#     bezier = appleSpringLite,  0.18, 0.90, 0.32, 1.00

#     # --- Windows (lebih cepat, lebih fluid, tetap elegan) ---
#     animation = windowsIn,     1, 2.2, appleSpringLite, popin 90%
#     animation = fadeIn,        1, 2.0, appleIn
#     animation = windowsOut,    1, 1.8, appleOut, popin 94%
#     animation = fadeOut,       1, 1.6, appleOut
#     animation = windowsMove,   1, 2.3, appleFluid, slide
#     animation = border,        1, 8, appleFluid

#     # --- Layers (lebih halus & glide) ---
#     animation = layersIn,      1, 2.0, appleSpringLite, popin 94%
#     animation = layersOut,     1, 1.6, appleOut, popin 95%

#     # --- Fade ---
#     animation = fadeLayersIn,  1, 0.4, appleIn
#     animation = fadeLayersOut, 1, 1.8, appleOut

#     # --- Workspaces (macOS-style Mission Control glide) ---
#     animation = workspaces,    1, 5.5, appleFluid, slide

#     # --- Special Workspace ---
#     animation = specialWorkspaceIn,  1, 2.2, appleSpringLite, slidevert
#     animation = specialWorkspaceOut, 1, 1.2, appleOut, slidevert
# }
# Slower one
animations {
    enabled = true

    # --- Curves Smooth Apple With Ending Slow Tail ---
    bezier = appleTailSmooth,  0.12, 0.85, 0.20, 1.00
    bezier = appleTailSpring,  0.16, 1.00, 0.32, 1.00
    bezier = appleEaseOut,     0.25, 0.10, 0.25, 1.00
    bezier = appleTailSmooth, 0.12, 0.85, 0.20, 1.00

    # WINDOWS
    animation = windowsIn,     1, 2.8, appleTailSpring, popin 90%
    animation = fadeIn,        1, 2.6, appleTailSmooth
    animation = windowsOut,    1, 2.4, appleTailSmooth, popin 94%
    animation = fadeOut,       1, 2.2, appleTailSmooth
    animation = windowsMove,   1, 2.7, appleTailSmooth, slide
    animation = border,        1, 9, appleEaseOut

    # LAYERS
    animation = layersIn,      1, 2.4, appleTailSpring, popin 94%
    animation = layersOut,     1, 2.1, appleTailSmooth, popin 95%

    # FADE
    animation = fadeLayersIn,  1, 0.5, appleEaseOut
    animation = fadeLayersOut, 1, 2.0, appleTailSmooth

    # WORKSPACES (mirip Mission Control: cepat → glide → slow end)
    animation = workspaces,    1, 6.0, appleTailSmooth, slide

    # SPECIAL WORKSPACE
    animation = specialWorkspaceIn,  1, 2.5, appleTailSpring, slidevert
    animation = specialWorkspaceOut, 1, 1.8, appleTailSmooth, slidevert
  
    # Lockscreen
    animation = layersOut, 1, 3, appleTailSmooth, slidevert
    animation = fadeLayersOut, 1, 3, appleTailSmooth
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]
windowrulev = float,class:^(showmethekey-gtk)$
windowrulev = pin,class:^(showmethekey-gtk)$
windowrule {
  name = apply-something
  match:class = my-window

  border_size = 10
}

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    # pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0.1 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
        scroll_factor = 0.3
    }
}


# See https://wiki.hypr.land/Configuring/Gestures
gesture = 4, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
device {
    name = synaptics-tm3276-004
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier


# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod Shift, Q, killactive
bind = $mainMod, Return, exec, $terminal
bind = $mainMod Shift, M, exit,
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod Shift, R, exec, ~/.config/hypr/scripts/reload.sh
bind = $mainMod Shift, T, exec, ~/.config/hypr/scripts/sys-cleaning.sh
bind = $mainMod Shift, L, exec, hyprlock
bind = $mainMod, D, exec, STATUS=$(dunstctl is-paused); if [ "$STATUS" = "false" ]; then notify-send -u critical "DND Enabled" "Notifications silenced"; sleep 0.5; dunstctl set-paused true; else dunstctl set-paused false; notify-send -u low "DND Disabled" "Notifications active"; fi


# Move focus with mainMod + vim key
bind = $mainMod, l, movefocus, l
bind = $mainMod, h, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10


bind = $mainMod, code:49, togglespecialworkspace, magic
bind = $mainMod SHIFT, code:49, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow


# Screenshot
bind = , Print, exec, bash -c 'mkdir -p ~/Pictures/Screenshot && FILE="$HOME/Pictures/Screenshot/$(date +%Y-%m-%d\ at\ %H.%M.%S).png" && grimblast save screen "$FILE" && wl-copy < "$FILE" && notify-send -i "$FILE" "Screenshot Captured" "Saved & Copied to Clipboard"'
bind = SHIFT, Print, exec, bash -c 'mkdir -p ~/Pictures/Screenshot && FILE="$HOME/Pictures/Screenshot/$(date +%Y-%m-%d\ at\ %H.%M.%S).png" && grimblast save area "$FILE" && wl-copy < "$FILE" && notify-send -i "$FILE" "Screenshot Captured" "Area Saved & Copied to Clipboard"'


# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, ~/.config/hypr/scripts/toggle_mute.sh
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 8%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 8%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##### WINDOWS AND WORKSPACES
# == Waybar
layerrule = blur on, match:namespace waybar
layerrule = xray on, match:namespace waybar # fix flickering, disable calculate bg
layerrule = ignore_alpha 0.00, match:namespace waybar

# == Rofi
layerrule = blur on, match:namespace rofi

# == hyprlock
layerrule = animation slidevert, match:namespace hyprlock

# == notifications
layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha 0.00, match:namespace notifications

# == Rofi 
layerrule = blur on, match:namespace rofi
layerrule = ignore_alpha 0.0, match:namespace rofi


# == grimblast
layerrule = no_anim on, match:namespace selection
